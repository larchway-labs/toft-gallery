# The manifest is optional and still the better door: a job declared here is
# part of the application rather than part of its deployment, so it versions
# with the code it runs and a rollback takes the command back with it.

[app]
name = "Reconcile"

[runtime]
python = ">=3.11"

[jobs.close]
command = "python worker.py"
timeout = 900          # seconds. A real close is minutes; the ceiling is 24 hours.
memory  = 512          # MiB, its own — not the web process's
retries = 1            # off by default everywhere; one extra attempt is enough here
viewer_runnable = true # a person may start it from the app's Automation tab

  [jobs.close.params.period]
  type     = "string"
  required = false
  help     = "Which month to close, as YYYY-MM. Defaults to the settings document."
